name: Build Windows app and installer

# Builds the Windows bundle, the portable .exe and the Inno Setup installer on
# a Windows runner. Every run uploads the files as workflow artifacts and
# publishes them to the GitHub release tagged v<app version>, so these stable
# URLs always serve the newest installer:
#   .../releases/latest/download/YouTubeDownloader-Installer.exe
#   .../releases/latest/download/YouTubeDownloader_Portable.exe
#
# Runs on a v* tag push, on a push to main that touches the app, and by hand.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "installer/**"
      - "scripts/build_exe.bat"
      - "scripts/make_icon.py"
      - "YouTubeDownloader.spec"
      - "requirements.txt"
      - ".github/workflows/windows-installer.yml"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install FFmpeg and Inno Setup
        run: |
          choco install ffmpeg innosetup --no-progress -y

      - name: Generate the application icon
        run: python scripts/make_icon.py

      - name: Build the app folder (FFmpeg bundled)
        env:
          YD_BUNDLE_FFMPEG: "1"
        run: python -m PyInstaller --noconfirm --clean YouTubeDownloader.spec

      - name: Build the portable single-file .exe
        env:
          YD_ONEFILE: "1"
          YD_BUNDLE_FFMPEG: "1"
        run: >
          python -m PyInstaller --noconfirm --clean
          --distpath dist\portable --workpath build\onefile
          YouTubeDownloader.spec

      - name: Read the app version
        id: version
        run: |
          $v = python -c "import app; print(app.__version__)"
          "value=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Compile the installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
              /DAppVersion=${{ steps.version.outputs.value }} `
              installer\YouTubeDownloader.iss

      - name: Collect release assets
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item "dist\YouTubeDownloader-Setup-${{ steps.version.outputs.value }}.exe" `
                    "out\YouTubeDownloader-Installer.exe"
          Copy-Item "dist\portable\YouTubeDownloader.exe" `
                    "out\YouTubeDownloader_Portable.exe"
          Get-ChildItem out | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: YouTubeDownloader-Windows-${{ steps.version.outputs.value }}
          path: out/*
          if-no-files-found: error

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
          SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "v$env:VERSION"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            # A branch build has no tag yet. Creating the ref through the API does
            # not fire another workflow run; tag builds already have theirs.
            gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" `
              -f "ref=refs/tags/$tag" -f "sha=$env:SHA" 2>$null | Out-Null
            gh release create $tag `
              --title "YouTube Downloader $env:VERSION" `
              --notes "Windows installer and portable build for version $env:VERSION." `
              --verify-tag
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          gh release upload $tag out/* --clobber
