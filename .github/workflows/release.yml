name: Build and release Windows and Android

# Builds both apps, then publishes every asset to the GitHub release for the
# current version, so these stable URLs always serve the newest builds:
#   .../releases/latest/download/YouTubeDownloader-Installer.exe
#   .../releases/latest/download/YouTubeDownloader_Portable.exe
#   .../releases/latest/download/YouTubeDownloader-Android.apk
#
# Runs on a v* tag push, on a push to main that touches either app, and by hand.
# The Windows job runs on a Windows runner (PyInstaller + Inno Setup); the
# Android job builds the signed release APK on Linux. A separate publish job
# waits for both, so a release never goes out half-built.
#
# The Windows binaries are Authenticode-signed when signing credentials are
# configured (see the "Code signing" section of README.md). Without them the
# build still succeeds and publishes unsigned, with a warning in the log.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "android/**"
      - "installer/**"
      - "scripts/**"
      - "YouTubeDownloader.spec"
      - "requirements.txt"
      - ".github/workflows/release.yml"
    tags:
      - "v*"

permissions:
  contents: write
  # Lets the Windows job sign in to Azure with OIDC instead of a client secret.
  id-token: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Fetch the bundled JavaScript runtime
        run: python scripts/fetch_js_runtime.py

      # A real static build, not the package manager's shim: a copied shim
      # cannot run on a user's machine and made merged downloads fail.
      - name: Fetch FFmpeg binaries for the bundle
        run: python scripts/fetch_ffmpeg.py

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Generate the application icon
        run: python scripts/make_icon.py

      - name: Build the app folder (FFmpeg bundled)
        env:
          YD_BUNDLE_FFMPEG: "1"
        run: python -m PyInstaller --noconfirm --clean YouTubeDownloader.spec

      - name: Build the portable single-file .exe
        env:
          YD_ONEFILE: "1"
          YD_BUNDLE_FFMPEG: "1"
        run: >
          python -m PyInstaller --noconfirm --clean
          --distpath dist\portable --workpath build\onefile
          YouTubeDownloader.spec

      # Guards the packaging bug that shipped a broken ffmpeg.exe: the copy
      # that ends up next to the app must be a real binary and must answer
      # -version. A package-manager shim is a few hundred KB, a real static
      # build is around 100 MB, so the size check alone rules it out.
      - name: Verify the bundled FFmpeg runs
        shell: pwsh
        run: |
          function Find-Binary($name) {
            $found = @(Get-ChildItem -Path "dist\YouTubeDownloader" -Recurse -Filter $name -ErrorAction SilentlyContinue)
            if ($found.Count -eq 0) { throw "No $name in the app folder build." }
            return $found[0].FullName
          }
          function Assert-Runs($path, $marker) {
            $info = Get-Item $path
            Write-Host "Checking $($info.FullName) ($([math]::Round($info.Length / 1MB, 1)) MB)"
            if ($info.Length -lt 20MB) {
              throw "$($info.FullName) is only $($info.Length) bytes - a shim, not a real binary."
            }
            # Out-String consumes the whole stream: piping a native command into
            # Select-Object -First ends it early and reports a bogus exit code.
            $out = & $path -version 2>&1 | Out-String
            $code = $LASTEXITCODE
            Write-Host $out.Trim()
            if ($code -ne 0) { throw "$path exited with $code" }
            if ($out -notmatch $marker) { throw "$path did not report a $marker line." }
          }
          Assert-Runs (Find-Binary "ffmpeg.exe") "ffmpeg version"
          Assert-Runs (Find-Binary "ffprobe.exe") "ffprobe version"

      - name: Read the app version
        id: version
        run: |
          $v = python -c "import app; print(app.__version__)"
          "value=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Compile the installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
              /DAppVersion=${{ steps.version.outputs.value }} `
              installer\YouTubeDownloader.iss

      - name: Collect release assets
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item "dist\YouTubeDownloader-Setup-${{ steps.version.outputs.value }}.exe" `
                    "out\YouTubeDownloader-Installer.exe"
          Copy-Item "dist\portable\YouTubeDownloader.exe" `
                    "out\YouTubeDownloader_Portable.exe"
          Get-ChildItem out | Select-Object Name, Length

      # Signing is opt-in, so a fork, or a push before the signing account
      # exists, still produces a release. A half-configured repository signs
      # nothing and says so, rather than failing or shipping a broken signature.
      - name: Check for code-signing credentials
        id: signing
        shell: pwsh
        env:
          CLIENT_ID: ${{ secrets.AZURE_SIGNING_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_SIGNING_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SIGNING_SUBSCRIPTION_ID }}
          ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          PROFILE: ${{ secrets.AZURE_SIGNING_CERTIFICATE_PROFILE }}
        run: |
          $names = 'CLIENT_ID', 'TENANT_ID', 'SUBSCRIPTION_ID', 'ENDPOINT', 'ACCOUNT', 'PROFILE'
          $missing = @($names | Where-Object { -not [Environment]::GetEnvironmentVariable($_) })
          if ($missing.Count -gt 0) {
            Write-Warning "Not signing: missing $($missing -join ', '). This release ships unsigned and Windows will show an unknown publisher."
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
          else {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Sign in to Azure for code signing
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_SIGNING_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_SIGNING_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SIGNING_SUBSCRIPTION_ID }}

      - name: Sign the installer and the portable build
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\out
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # A signing step that silently produced nothing is worse than no signing:
      # the download then looks verified while it is not, so fail the build.
      - name: Verify the signatures
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem out -Filter *.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            $who = if ($sig.SignerCertificate) {
              $sig.SignerCertificate.GetNameInfo('SimpleName', $false)
            }
            else { '<unsigned>' }
            Write-Host "$($_.Name): $($sig.Status) - $who"
            if ($sig.Status -ne 'Valid') { $bad++ }
          }
          if ($bad -gt 0) { throw "$bad release file(s) failed signature verification." }

      # Published next to the binaries so anyone can confirm what they got,
      # which matters most while new builds are still earning SmartScreen trust.
      - name: Write SHA-256 checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem out -File | Where-Object Name -ne 'SHA256SUMS.txt' | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          # LF endings, not the CRLF Set-Content writes on Windows: sha256sum -c
          # reads a stray CR as part of the file name and fails to find it.
          $sums = "$PWD/out/SHA256SUMS.txt"
          [IO.File]::WriteAllText($sums, (($lines -join "`n") + "`n"))
          Get-Content $sums

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ steps.version.outputs.value }}
          path: out/*
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Collect release assets
        working-directory: android
        run: |
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk ../out/YouTubeDownloader-Android.apk
          ls -l ../out

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/YouTubeDownloader-Android.apk
          if-no-files-found: error

  publish:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' app/__init__.py)
          ANDROID_VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts)
          test -n "$VERSION"
          if [ "$VERSION" != "$ANDROID_VERSION" ]; then
            echo "Version mismatch: desktop $VERSION, Android $ANDROID_VERSION" >&2
            exit 1
          fi
          TAG="v$VERSION"
          ls -l out
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # A branch build has no tag yet. Creating the ref through the API does
            # not fire another workflow run; tag builds already have theirs.
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$TAG" -f "sha=$SHA" >/dev/null 2>&1 || true
            gh release create "$TAG" \
              --title "YouTube Downloader $VERSION" \
              --notes "Windows installer, portable build and Android APK for version $VERSION." \
              --verify-tag
          fi
          gh release upload "$TAG" out/* --clobber
